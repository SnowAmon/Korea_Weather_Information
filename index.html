<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 브라우저 탭 및 SNS 공유 시 표시될 제목 -->
  <title>실시간 기상 정보 전광판</title>
  <meta property="og:title" content="실시간 기상 정보 전광판">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', '맑은 고딕', sans-serif;
    }

    body {
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 1280x128 고정 전광판 프레임 */
    .led-board {
      width: 1280px;
      height: 128px;
      background-color: #080b10;
      border: 3px solid #1a233a;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center; /* 전체 수직 중앙 정렬 */
      justify-content: space-around;
      padding: 0 20px;
      color: #ffffff;
    }

    /* LED 닷 격자 필터 효과 */
    .led-board::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(rgba(0, 0, 0, 0.5) 35%, transparent 36%);
      background-size: 3px 3px;
      z-index: 10;
      pointer-events: none;
    }

    /* 각 섹션의 공통 구분선 및 완벽한 수직 중앙 정렬 */
    .board-section {
      display: flex;
      height: 100%; /* 높이 풀 채움 */
      align-items: center; /* 내부 요소 세로 중앙 정렬 */
      justify-content: center; /* 내부 요소 가로 중앙 정렬 */
      border-right: 1px solid #1e293b;
      padding-right: 20px;
      padding-left: 15px;
    }

    .board-section:last-child {
      border-right: none;
      padding-right: 0;
    }

    /* 1. 시간 영역 */
    .section-time {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .clock-date {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .clock-time {
      font-size: 30px;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      line-height: 1.1;
      white-space: nowrap;
    }

    /* 2. 날씨 메인 영역 */
    .section-weather-main {
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .weather-icon {
      font-size: 40px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .temp-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .temp-val {
      font-size: 30px;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
      line-height: 1.1;
    }

    .weather-desc {
      font-size: 13px;
      color: #e2e8f0;
      margin-top: 3px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 3. 날씨 상세 및 지역 정보 영역 */
    .section-weather-sub {
      gap: 18px;
      align-items: center;
      justify-content: center;
    }

    .sub-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .sub-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      white-space: nowrap;
    }

    .sub-value {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 4px;
      white-space: nowrap;
      line-height: 1;
    }

    .location-value {
      color: #00ffcc;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
    }

    /* 4. 실시간 뉴스 속보 흐름 영역 */
    .section-news {
      width: 320px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .news-badge {
      font-size: 12px;
      color: #ff3366;
      font-weight: 800;
      margin-bottom: 6px;
      white-space: nowrap;
      text-shadow: 0 0 5px rgba(255, 51, 102, 0.5);
      text-align: center;
      line-height: 1;
    }

    .news-ticker-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      display: flex;
      align-items: center;
    }

    .news-msg {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker 22s linear infinite;
      line-height: 1.2;
    }

    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="led-board">
    <!-- 1. 시간 영역 -->
    <div class="board-section section-time">
      <div class="clock-date" id="clockDate">00월 00일 (일)</div>
      <div class="clock-time" id="clockTime">00:00:00</div>
    </div>

    <!-- 2. 날씨 메인 영역 -->
    <div class="board-section section-weather-main">
      <div class="weather-icon" id="weatherIcon">☀️</div>
      <div class="temp-box">
        <div class="temp-val" id="tempVal">--°C</div>
        <div class="weather-desc" id="weatherDesc">날씨 로딩중</div>
      </div>
    </div>

    <!-- 3. 날씨 상세 + GPS 위치 영역 -->
    <div class="board-section section-weather-sub">
      <div class="sub-item">
        <span class="sub-label">현재위치</span>
        <span class="sub-value location-value" id="locationVal">탐색중...</span>
      </div>
      <div class="sub-item">
        <span class="sub-label">강수확률</span>
        <span class="sub-value" id="popVal">--%</span>
      </div>
      <div class="sub-item">
        <span class="sub-label">습도</span>
        <span class="sub-value" id="humidityVal">--%</span>
      </div>
      <div class="sub-item">
        <span class="sub-label">풍속</span>
        <span class="sub-value" id="windVal">--m/s</span>
      </div>
    </div>

    <!-- 4. 실시간 위치 뉴스 속보 영역 -->
    <div class="board-section section-news">
      <div class="news-badge" id="newsBadge">🚨 실시간 주요 소식</div>
      <div class="news-ticker-container">
        <div class="news-msg" id="newsMsg">실시간 소식을 불러오는 중입니다...</div>
      </div>
    </div>
  </div>

  <script>
    // 1. 실시간 시계
    function updateClock() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = weekDays[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockDate').textContent = `${month}월 ${date}일 (${dayName})`;
      document.getElementById('clockTime').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. GPS 수신 및 위치/날씨 데이터 로드
    function getMyLocationAndFetchWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchLocationName(lat, lon);
            fetchWeather(lat, lon);
          },
          (error) => {
            document.getElementById('locationVal').textContent = '대전';
            fetchWeather(36.3504, 127.3845);
            updateNewsText('대전');
          }
        );
      } else {
        document.getElementById('locationVal').textContent = '대전';
        fetchWeather(36.3504, 127.3845);
        updateNewsText('대전');
      }
    }

    // 3. GPS 위도/경도를 행정구역 이름으로 변환 후 뉴스 업데이트
    async function fetchLocationName(lat, lon) {
      try {
        const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
        const data = await response.json();
        
        let locationName = data.city || data.locality || data.principalSubdivision || '대전';
        locationName = locationName.replace('특별시', '').replace('광역시', '').replace('특별자치시', '');

        document.getElementById('locationVal').textContent = locationName;
        updateNewsText(locationName);
      } catch (err) {
        document.getElementById('locationVal').textContent = '대전';
        updateNewsText('대전');
      }
    }

    // 4. 뉴스 전광판 텍스트 설정
    function updateNewsText(regionName) {
      document.getElementById('newsBadge').textContent = `🚨 ${regionName} 지역 실시간 뉴스`;
      
      const newsList = [
        `[속보] ${regionName} 지역 주요 도로 기상상황 점검 및 안전 운행 당부`,
        `[기상] 오늘 ${regionName} 미세먼지 농도 보통 수준 유지... 야외 활동 원활`,
        `[행정] ${regionName} 시청, 계절 맞춤형 시민 생활 안전 및 대중교통 지원 강화`,
        `[정보] 실시간 기상 특보 및 유의사항은 기상청 공식 채널을 확인하세요.`
      ];

      document.getElementById('newsMsg').textContent = newsList.join('   |   ');
    }

    // 5. 실시간 날씨 데이터 가져오기
    async function fetchWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m,precipitation_probability&timezone=Asia%2FTokyo`;
        const response = await fetch(url);
        const data = await response.json();

        const current = data.current_weather;
        const temp = Math.round(current.temperature);
        const wind = current.windspeed;
        const weatherCode = current.weathercode;

        const humidity = data.hourly.relativehumidity_2m[0] || 50;
        const pop = data.hourly.precipitation_probability[0] || 0;

        let weatherText = '맑음';
        let weatherIcon = '☀️';

        if (weatherCode === 0) {
          weatherText = '맑음'; weatherIcon = '☀️';
        } else if (weatherCode >= 1 && weatherCode <= 3) {
          weatherText = '구름조금/흐림'; weatherIcon = '⛅';
        } else if (weatherCode >= 45 && weatherCode <= 48) {
          weatherText = '안개'; weatherIcon = '🌫️';
        } else if (weatherCode >= 51 && weatherCode <= 67) {
          weatherText = '비'; weatherIcon = '🌧️';
        } else if (weatherCode >= 71 && weatherCode <= 77) {
          weatherText = '눈'; weatherIcon = '❄️';
        } else if (weatherCode >= 80 && weatherCode <= 82) {
          weatherText = '소나기'; weatherIcon = '🌦️';
        } else if (weatherCode >= 95) {
          weatherText = '뇌우'; weatherIcon = '⚡';
        }

        document.getElementById('tempVal').textContent = `${temp}°C`;
        document.getElementById('weatherDesc').textContent = weatherText;
        document.getElementById('weatherIcon').textContent = weatherIcon;
        document.getElementById('popVal').textContent = `${pop}%`;
        document.getElementById('humidityVal').textContent = `${humidity}%`;
        document.getElementById('windVal').textContent = `${wind}m/s`;

      } catch (error) {
        console.error('날씨 로드 실패:', error);
      }
    }

    getMyLocationAndFetchWeather();
    setInterval(getMyLocationAndFetchWeather, 600000);
  </script>
</body>
</html>
